<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parking Problems People Face</title>
<meta name="description" content="Parking and EV charging problems people faced in Kozhikode, Kochi, Kerala and across India, each linked to the original Reddit post, forum thread or news report.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@1,8..60,400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f3efe6; --paper-2: #e9e3d6; --ink: #16181b; --ink-2: #4a4e55; --ink-3: #7b7f86;
  --rule: #d4ccbb; --card: #fbf9f4; --sign: #1747a6; --sign-ink: #ffffff; --stop: #c8322b; --mark: #f0b91c;
  --shadow: 0 1px 0 rgba(22,24,27,.06), 0 8px 24px -16px rgba(22,24,27,.35);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141517; --paper-2: #1b1d20; --ink: #ece8df; --ink-2: #b4b0a7; --ink-3: #85827b;
    --rule: #2c2f33; --card: #1b1d21; --sign: #3c6fd6; --stop: #e0554d;
    --shadow: 0 1px 0 rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"] {
  --paper: #141517; --paper-2: #1b1d20; --ink: #ece8df; --ink-2: #b4b0a7; --ink-3: #85827b;
  --rule: #2c2f33; --card: #1b1d21; --sign: #3c6fd6; --stop: #e0554d;
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.9);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.5 "Barlow", system-ui, sans-serif; }
a { color: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
.lane { height: 8px; background: repeating-linear-gradient(90deg, var(--mark) 0 46px, transparent 46px 74px), var(--ink); }

header { display: flex; align-items: center; gap: 14px; padding: 22px 0 16px; }
.sign {
  flex: none; width: 46px; height: 46px; border-radius: 8px; background: var(--sign); color: var(--sign-ink);
  display: grid; place-items: center; position: relative; font: 800 34px/1 "Barlow Condensed", sans-serif;
  box-shadow: inset 0 0 0 3px var(--sign), inset 0 0 0 5px var(--sign-ink);
}
.sign::after {
  content: ""; position: absolute; inset: 6px; border-radius: 50%; border: 4px solid var(--stop);
  background: linear-gradient(45deg, transparent calc(50% - 2px), var(--stop) calc(50% - 2px) calc(50% + 2px), transparent calc(50% + 2px));
}
h1 { font: 800 clamp(26px, 4vw, 38px)/1 "Barlow Condensed", sans-serif; text-transform: uppercase; margin: 0; }
header p { margin: 2px 0 0; color: var(--ink-3); font-size: 14px; }
.theme { margin-left: auto; font: 600 13px "Barlow", sans-serif; background: var(--card); color: var(--ink-2); border: 1px solid var(--rule); border-radius: 20px; padding: 6px 12px; cursor: pointer; }

.toolbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter: blur(8px); border-top: 3px solid var(--ink); border-bottom: 1px solid var(--rule); padding: 10px 0; }
.toolbar .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar input, .toolbar select { font: 500 15px "Barlow", sans-serif; color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 8px 12px; min-width: 0; }
.toolbar input { flex: 1 1 240px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.seg button { font: 600 14px "Barlow", sans-serif; border: 0; background: var(--card); color: var(--ink-2); padding: 8px 12px; cursor: pointer; border-right: 1px solid var(--rule); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.count { font: 700 15px "Barlow Condensed", sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-left: auto; }
.jump { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.jump a { font: 700 14px/1 "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .03em; text-decoration: none; padding: 6px 8px 5px; border-radius: 3px; background: var(--paper-2); color: var(--ink-2); }
.jump a b { color: var(--stop); margin-left: 4px; }
.jump a:hover { background: var(--ink); color: var(--paper); }
:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }

.pgroup { padding: 26px 0 8px; }
.ghead { font: 800 30px/1 "Barlow Condensed", sans-serif; text-transform: uppercase; margin: 0 0 14px; display: flex; align-items: baseline; gap: 10px; scroll-margin-top: 130px; }
.ghead .rank { color: var(--stop); font-variant-numeric: tabular-nums; }
.ghead small { font: 500 14px/1 "Barlow", sans-serif; text-transform: none; color: var(--ink-3); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.card {
  background: var(--card); border: 1px solid var(--rule); border-left: 5px solid var(--ink-3); border-radius: 4px; padding: 14px 16px 12px;
  display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); min-width: 0;
}
.card.reddit { border-left-color: #ff5a1f; }
.card.news { border-left-color: var(--sign); }
.card.web { border-left-color: var(--mark); }
.problem { margin: 0; font: 600 17px/1.4 "Barlow", sans-serif; }
.quote { margin: 0; font: italic 400 16px/1.4 "Source Serif 4", Georgia, serif; color: var(--ink-2); padding-left: 12px; border-left: 2px solid var(--mark); }
.src { margin-top: auto; padding-top: 8px; border-top: 1px dashed var(--rule); font-size: 13px; color: var(--ink-3); display: grid; gap: 4px; }
.src a { color: var(--sign); font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
.src a:hover { text-decoration: underline; }
.src .who { font: 600 12px/1.3 "Barlow", sans-serif; text-transform: uppercase; letter-spacing: .05em; }
.related a { font-weight: 500; color: var(--ink-2); }
.empty { text-align: center; padding: 60px 0; color: var(--ink-3); font: 700 24px "Barlow Condensed", sans-serif; text-transform: uppercase; }
footer { padding: 30px 0 40px; color: var(--ink-3); font-size: 13px; }

@media (max-width: 700px) {
  .grid { grid-template-columns: 1fr; }
  .toolbar { position: static; }
  .count { margin-left: 0; width: 100%; }
  header p { display: none; }
}
</style>
</head>
<body>
<div class="lane"></div>
<div class="wrap">
  <header>
    <div class="sign" aria-hidden="true">P</div>
    <div>
      <h1>Parking problems people face</h1>
      <p id="sub"></p>
    </div>
    <button class="theme" id="theme" type="button">Theme</button>
  </header>
</div>

<div class="toolbar">
  <div class="wrap">
    <div class="row">
      <input id="q" type="search" placeholder="Search problems…" aria-label="Search">
      <div class="seg" id="kinds" role="group" aria-label="Source type"></div>
      <select id="city" aria-label="City"></select>
      <span class="count" id="count"></span>
    </div>
    <nav class="jump" id="jump" aria-label="Jump to problem"></nav>
  </div>
</div>

<main class="wrap" id="list"></main>

<footer class="wrap">
  Problem lines are AI summaries of each search result's title and snippet. Open the original before quoting. Collected <span id="collected"></span>.
</footer>

<script>
const DATA = /*__DATA__*/null;
const CATS = {
  "no-space": "Can't find a spot",
  "roadside-congestion": "Roadside parking, jams",
  "fines-towing": "Fines and towing",
  "fees": "Fees and overcharging",
  "disputes": "Fights and disputes",
  "residential": "Homes and apartments",
  "hubs": "Metro, station, mall, hospital",
  "ev-charging": "EV charging",
  "failed-facilities": "Parking that failed or sits unused",
};
const KINDS = { all: "All", reddit: "Reddit", web: "Forums", news: "News" };
const KERALA = new Set(["Kozhikode", "Kochi", "Thiruvananthapuram", "Thrissur", "Kerala (other)"]);

const posts = DATA.posts;
const state = { kind: "all", city: "", q: "" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const countBy = (arr, key) => arr.reduce((m, p) => (m[p[key]] = (m[p[key]] || 0) + 1, m), {});
// Google News dates arrive as "04/28/2025, 07:00 AM, +0000 UTC".
const niceDate = (d) => { const m = /^(\d\d)\/(\d\d)\/(\d{4})/.exec(d || ""); return m ? new Date(+m[3], m[1] - 1, +m[2]).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : d; };
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };
const ext = `target="_blank" rel="noopener noreferrer"`;

// Theme toggle (per-viewer convenience, storage may be unavailable)
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
$("theme").onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch {}
};

const kerala = posts.filter((p) => KERALA.has(p.city)).length;
$("sub").textContent = `${posts.length} problems from Reddit, forums and news, ${kerala} of them in Kerala. Biggest problem first, Kerala first within each.`;
$("collected").textContent = DATA.meta.collected;
const cityCounts = countBy(posts, "city");
$("city").innerHTML = `<option value="">All places</option>` + DATA.meta.cities.filter((c) => cityCounts[c])
  .map((c) => `<option value="${esc(c)}">${esc(c)} (${cityCounts[c]})</option>`).join("");

function matches(p) {
  if (state.kind !== "all" && p.kind !== state.kind) return false;
  if (state.city && p.city !== state.city) return false;
  if (state.q) {
    const hay = `${p.problem} ${p.quote} ${p.title} ${p.snippet} ${p.source} ${p.city}`.toLowerCase();
    if (!state.q.split(/\s+/).every((w) => hay.includes(w))) return false;
  }
  return true;
}

function card(p) {
  const showQuote = p.quote && !p.title.toLowerCase().includes(p.quote.toLowerCase().slice(0, 40));
  const who = [p.kind === "reddit" ? p.source : (p.source || host(p.url)), p.city, p.engagement || niceDate(p.date)].filter(Boolean);
  const related = p.related ? `<span class="related">+${p.related.length} more ${p.related.length === 1 ? "report" : "reports"}: ${p.related.map((r) => `<a href="${esc(r.url)}" ${ext}>${esc(r.source || host(r.url))}</a>`).join(", ")}</span>` : "";
  return `<article class="card ${p.kind}">
    <p class="problem">${esc(p.problem || p.title)}</p>
    ${showQuote ? `<p class="quote">“${esc(p.quote)}”</p>` : ""}
    <div class="src"><span class="who">${who.map(esc).join(" · ")}</span><a href="${esc(p.url)}" ${ext}>${esc(p.problem ? p.title : "Read original")} ↗</a>${related}</div>
  </article>`;
}

function render() {
  $("kinds").innerHTML = Object.entries(KINDS).map(([k, l]) => `<button data-kind="${k}" aria-pressed="${state.kind === k}" type="button">${l}</button>`).join("");
  // Grouped by problem, biggest group first. Within a group the build order
  // holds: Kerala first, then Reddit and forums before news.
  const list = posts.filter(matches);
  const groups = Object.entries(countBy(list, "category")).sort((a, b) => b[1] - a[1]);
  $("count").textContent = `${list.length} of ${posts.length}`;
  $("jump").innerHTML = groups.map(([cat, n]) => `<a href="#p-${cat}">${esc(CATS[cat] || cat)}<b>${n}</b></a>`).join("");
  $("list").innerHTML = list.length ? groups.map(([cat, n], g) => `<section class="pgroup">
      <h2 class="ghead" id="p-${cat}"><span class="rank">${String(g + 1).padStart(2, "0")}</span> ${esc(CATS[cat] || cat)} <small>${n} ${n === 1 ? "problem" : "problems"}</small></h2>
      <div class="grid">${list.filter((p) => p.category === cat).map(card).join("")}</div></section>`).join("")
    : `<div class="empty">Nothing matches.</div>`;
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-kind]");
  if (t) { state.kind = t.dataset.kind; render(); }
});
$("q").addEventListener("input", (e) => { state.q = e.target.value.trim().toLowerCase(); render(); });
$("city").addEventListener("change", (e) => { state.city = e.target.value; render(); });
render();
</script>
</body>
</html>
